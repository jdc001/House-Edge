<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
/* One visual world: a neon Strip at night. Skyline on top, ledger-style panels below, tab bar at the bottom. */
:root{
  --night:#0c0820; --panel:#17123a; --panel2:#201a4d; --line:#342c72;
  --gold:#ffd319; --pink:#ff3ea5; --cyan:#2de2e6; --good:#7dff9b; --bad:#ff5e6c;
  --text:#f4f0ff; --mute:#a69fd6;
  --display:'Monoton',cursive; --serif:'DM Serif Display',Georgia,serif; --body:'Rubik',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--night);color:var(--text);font-family:var(--body)}
body{display:flex;flex-direction:column;-webkit-user-select:none;user-select:none;overflow:hidden}
button{font-family:var(--body);color:inherit}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

#hud{padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 12px) 8px calc(env(safe-area-inset-left) + 12px);background:linear-gradient(#150f36,#0c0820);border-bottom:1px solid var(--line);flex:none}
.hud-top{display:flex;align-items:center;gap:10px}
.brand{font-family:var(--display);color:var(--pink);font-size:20px;letter-spacing:1px;text-shadow:0 0 6px #ff3ea5aa,0 0 16px #ff3ea555;white-space:nowrap}
.date{margin-left:auto;text-align:right;line-height:1.1}
.date b{font-size:15px;display:block}
.date span{font-size:11px;color:var(--mute)}
.iconbtn{background:none;border:1px solid var(--line);border-radius:10px;width:38px;height:34px;font-size:17px;flex:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 8px}
.stat small{display:block;font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.8px}
.stat b{font-size:15px}
.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.meter small{display:flex;justify-content:space-between;font-size:10px;color:var(--mute)}
.bar{height:5px;border-radius:3px;background:#2a2360;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;border-radius:3px}

#view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:12px calc(env(safe-area-inset-right) + 12px) 110px calc(env(safe-area-inset-left) + 12px)}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;align-items:flex-end;background:#0f0a2bf2;border-top:1px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:5}
#tabs button.tab{background:none;border:none;color:var(--mute);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;min-width:0;flex:1}
#tabs button.tab span{font-size:19px;filter:grayscale(.6)}
#tabs button.tab.on{color:var(--text)}
#tabs button.tab.on span{filter:none}
#nextBtn{background:linear-gradient(135deg,var(--pink),#ff7ad9);border:none;border-radius:999px;padding:11px 12px;font-weight:800;font-size:13px;flex:none;color:#fff;box-shadow:0 0 18px #ff3ea577;transform:translateY(-10px);white-space:nowrap}
#nextBtn:disabled{opacity:.5}

h2.sec{font-family:var(--serif);font-weight:400;font-size:22px;margin:4px 0 0;text-wrap:balance}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.panel h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--mute);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
.skyline{overflow-x:auto;overflow-y:hidden;border-radius:16px;border:1px solid var(--line);background:#0c0820;-webkit-overflow-scrolling:touch}
.skyline svg{display:block;height:280px}
.hint{font-size:12px;color:var(--mute);line-height:1.4}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;width:100%}
.pcard.mine{border-color:#ffd31988;box-shadow:inset 3px 0 0 var(--gold)}
.pcard .t{display:flex;align-items:center;gap:8px}
.pcard .t b{font-size:15px}
.pcard .t .loc{margin-left:auto;font-size:10px;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:1px 5px}
.pcard .r{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}
.pcard .r b{color:var(--text);font-weight:600}
.own{display:flex;height:7px;border-radius:4px;overflow:hidden;background:#2a2360}
.own i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--mute);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.sw{width:8px;height:8px;border-radius:2px;display:inline-block}
.chip{display:inline-block;font-size:11px;border-radius:999px;padding:2px 8px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.chip.gold{border-color:var(--gold);color:var(--gold)}
.chip.good{border-color:#7dff9b88;color:var(--good)}
.chip.bad{border-color:#ff5e6c88;color:var(--bad)}
.chip.cyan{border-color:#2de2e688;color:var(--cyan)}
.kv{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-size:13px}
.kv div:nth-child(odd){color:var(--mute)}
.kv div:nth-child(even){text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.kv .tot{color:var(--text)!important;font-weight:700!important;border-top:1px solid var(--line);padding-top:5px}
.btn{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:10px 12px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;width:100%;cursor:pointer}
.btn .c{color:var(--gold);font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.btn small{display:block;font-size:11px;color:var(--mute);font-weight:400;margin-top:2px}
.btn.primary{background:linear-gradient(135deg,var(--pink),#ff7ad9);border:none;color:#fff;justify-content:center;text-align:center}
.btn.ghost{background:transparent;justify-content:center}
.btn:disabled{opacity:.42;cursor:default}
.btns{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;background:transparent;border:none;color:var(--mute);padding:8px 4px;font-size:12px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--cyan);color:#0c0820}
.seg.dis{opacity:.45;pointer-events:none}
.setrow{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:8px;margin-bottom:7px;font-size:12px;color:var(--mute)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.toggle:last-child{border-bottom:none}
.sw-btn{width:46px;height:26px;border-radius:13px;background:#2a2360;border:1px solid var(--line);position:relative;flex:none;cursor:pointer}
.sw-btn::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--mute);transition:.2s}
.sw-btn.on{background:var(--cyan)}
.sw-btn.on::after{left:22px;background:#0c0820}
.mix{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:6px 0}
.mix i{display:block;height:100%}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.li:last-child{border-bottom:none}
.li .grow{flex:1;min-width:0}
.li .grow small{display:block;color:var(--mute);font-size:11px}
.li .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.pos{color:var(--good)} .neg{color:var(--bad)}
.filters{display:flex;gap:6px;overflow-x:auto}
.filters button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--mute);white-space:nowrap}
.filters button.on{background:var(--gold);color:#0c0820;border-color:var(--gold);font-weight:700}

.overlay{position:fixed;inset:0;background:#07051acc;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.overlay[hidden]{display:none}
.sheet{background:var(--night);border:1px solid var(--line);border-bottom:none;border-radius:20px 20px 0 0;width:100%;max-width:760px;max-height:94%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 20px) calc(env(safe-area-inset-left) + 14px);display:flex;flex-direction:column;gap:12px}
@media (min-width:760px){.overlay{align-items:center}.sheet{border-radius:20px;border-bottom:1px solid var(--line);max-height:90%}}
.sheet-head{display:flex;align-items:center;gap:10px;position:sticky;top:-14px;background:var(--night);padding:6px 0;z-index:2}
.sheet-head h2{margin:0;font-family:var(--serif);font-weight:400;font-size:24px;flex:1;min-width:0;text-wrap:balance}
.hero{display:flex;gap:12px;align-items:flex-end}
.hero3d{width:min(46%,220px);height:220px;flex:none;border-radius:12px;background:#0c0820;border:1px solid var(--line);touch-action:none;display:block}
.stage{position:relative;height:min(64vh,620px);min-height:340px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#0c0820;box-shadow:0 0 0 1px #ff3ea522,0 18px 50px #0009}
.stage canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.camctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.camctl button{width:38px;height:38px;border-radius:10px;background:#140f35cc;border:1px solid var(--line);color:var(--text);font-size:16px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);cursor:pointer}
.stagehint{position:absolute;left:10px;bottom:10px;font-size:11px;color:#d9d3ff;background:#0c0820b3;padding:5px 9px;border-radius:8px;pointer-events:none}
@media (min-width:900px){.stage{height:min(70vh,680px)}}
.hero .info{flex:1;display:flex;flex-direction:column;gap:6px;font-size:13px}
.stars{color:var(--gold);letter-spacing:1px}
.news{font-family:var(--serif);font-size:30px;text-align:center;border-bottom:3px double var(--line);padding-bottom:6px;margin:0}
.newsdate{text-align:center;font-size:11px;letter-spacing:2px;color:var(--mute);text-transform:uppercase}
.story{font-size:14px;line-height:1.45;color:#ddd8ff;border-bottom:1px solid var(--line);padding:8px 0}
.story:last-child{border-bottom:none}
.story b{color:var(--text)}
.evt-art{font-size:44px;text-align:center}
.evt-text{font-size:15px;line-height:1.5;color:#e4e0ff;max-width:62ch}
.tcard{border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;background:var(--panel)}
.tcard.on{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan)}
.tcard b{font-size:13px;display:block}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.affs{display:flex;gap:3px;margin-top:6px;align-items:flex-end;height:22px}
.affs i{flex:1;border-radius:2px 2px 0 0}
input[type=range]{width:100%;accent-color:var(--pink)}
input[type=text]{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px;font:16px var(--body)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 10px);transform:translateX(-50%);background:var(--panel2);border:1px solid var(--gold);color:var(--text);padding:10px 14px;border-radius:12px;font-size:13px;z-index:40;max-width:90%;box-shadow:0 8px 30px #000a;transition:opacity .3s}
.spark{width:100%;height:120px;display:block}
.logo-big{font-family:var(--display);color:var(--pink);font-size:40px;text-align:center;text-shadow:0 0 8px #ff3ea5aa,0 0 24px #ff3ea566;margin:6px 0 0;line-height:1.1}
.lede{font-family:var(--serif);font-size:19px;text-align:center;color:#e9e4ff;margin:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.ver{text-align:center;font-size:13px;letter-spacing:.1em;opacity:.75;margin:2px 0 8px}
/* results tables */
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
.ctable{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
.ctable th{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);font-weight:600;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.ctable td{text-align:right;padding:7px 8px;border-bottom:1px solid #2a2360;white-space:nowrap;vertical-align:middle}
.ctable th:first-child,.ctable td:first-child{text-align:left;position:sticky;left:0;background:var(--panel);z-index:1}
.ctable td:first-child small{display:block;color:var(--mute);font-size:10.5px;margin-top:2px;white-space:normal;max-width:180px}
.ctable tfoot td,.ctable tr.tot td{font-weight:700;color:var(--text);border-top:1px solid var(--line)}
.ctable tbody tr[data-a]{cursor:pointer}
.ctable tbody tr[data-a]:hover td{background:#211b4f}
.ctable.cmp th[data-a]{cursor:pointer}
.ctable.cmp th.on{color:var(--gold)}
.ctable.cmp tr.mine td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
.ctable.pl td:first-child{color:var(--mute)}
.ctable.pl tr.tot td:first-child{color:var(--text)}
.ctable .gold{color:var(--gold)}
.ctable.cmp td:first-child{white-space:normal;min-width:130px;max-width:170px}
.ctable.pl td:first-child{white-space:normal;min-width:96px}
@media (max-width:520px){.ctable{font-size:11.5px}.ctable th{font-size:9.5px;letter-spacing:.3px;padding:6px 5px}.ctable td{padding:6px 5px}.ctable.cmp td:first-child{min-width:112px;max-width:132px}.ctable.cmp td:first-child b{font-size:12px}.ctable.pl td:first-child{min-width:84px;max-width:110px}}
</style>
</head>

function macro(t){let m=1;for(const s of S.shocks){const k=t-s.s;if(k>=0&&k<s.len)m*=s.d+(1-s.d)*(k/s.len);}return m;}
const prime=t=>lerpT(yf(t),PRIME);
const loanRate=()=>prime(S.t)+2+S.rateAdd;
const houseIdx=t=>lerpT(yf(t),HOUSE);
const landIdx=t=>lerpT(yf(t),LANDT)*(.85+.15*macro(t));
const valMult=t=>5.5*(.8+.3*macro(t));
const mobEra=()=>lerpT(yf(S.t),MOB_ERA);
function cluster(p){const n=S.props.filter(o=>o!==p&&o.loc===p.loc&&o.status==='op'&&o.q>=4).length;return 1+Math.min(.15,n*.04);}
function landVal(p){return p.acres*LOC[p.loc].acre*landIdx(S.t)*cluster(p);}
function maxRooms(p){return Math.round(p.acres*110/100)*100;}
function ctrlBlocs(p){const b={you:(p.shares.you||0)>0?(p.shares.you||0)+(p.shares.inv||0):0,pub:p.shares.pub||0};for(const r of S.rivals)b[r.id]=p.shares[r.id]||0;return b;}
function ctrl(p){const b=ctrlBlocs(p);let best='pub',bv=-1;for(const k of ['you',...S.rivals.map(r=>r.id),'pub']){if(b[k]>bv){bv=b[k];best=k;}}return best;}
const mine=p=>ctrl(p)==='you';
function val(p){
  const land=landVal(p);
  if(p.status==='lot')return land;
  if(p.status==='build')return land+p.book;
  const n=p.ttm.length;
  const ann=n?p.ttm.reduce((a,b)=>a+b,0)/n*4:0;
  const floor=(land+p.book)*.55;
  const v=Math.max(land,ann*valMult(S.t),floor);
  return n<2?Math.max(v,land+p.book*.9):v;
}
const stakesVal=()=>S.props.reduce((s,p)=>s+(p.shares.you||0)/100*val(p),0);
const netWorth=()=>S.cash-S.loan+stakesVal();
const creditLimit=()=>(TITLE_CREDIT[S.title]*infl(S.t)+.5*stakesVal())*S.creditBonus;
const available=()=>Math.max(0,S.cash)+Math.max(0,creditLimit()-S.loan);
function spend(amt){S.cash-=amt;if(S.cash<0){const d=Math.min(-S.cash,Math.max(0,creditLimit()-S.loan));S.loan+=d;S.cash+=d;}}
function autoSet(p){
  const b=baseSet(p);if(p.last&&p.status==='op'){const ladder=['budget','market','premium'];let i=ladder.indexOf(b.rate);if(p.last.occ>.97&&i<2)i++;else if(p.last.occ<.55&&i>0)i--;b.rate=ladder[i];}return b;
}
function baseSet(p){
  if(p.q>=4)return{rate:'premium',limits:'high',hold:'std',comps:'generous',mkt:'high',staff:'luxe',layout:'open'};
  if(p.q===3)return{rate:'market',limits:'mid',hold:'std',comps:'normal',mkt:'med',staff:'std',layout:'maze'};
  return{rate:'budget',limits:'low',hold:'loose',comps:'tight',mkt:'low',staff:'lean',layout:'maze'};
}
function novelty(p){const age=yf(S.t)-(p.opened||1950);let n=1+.35*Math.exp(-age/4);const dup=S.props.filter(o=>o!==p&&o.status==='op'&&o.theme===p.theme).length;n*=dup?1-.05*dup:1.08;if(p.buzz>0)n*=1.1;if(p.am.includes('attraction'))n*=1.06;return n;}
function eraFit(theme){const y=yf(S.t);if((theme==='classic'||theme==='western')&&y>1995)return .85;return 1;}
function attraction(p,seg,set){
  set=set||p.set;const y=yf(S.t);
  let a=LOC[p.loc].m*cluster(p)*SEG[seg].q[p.q-1]*THEMES[p.theme].aff[seg]*eraFit(p.theme)*novelty(p)*(.5+.5*p.cond/100);
  let b=1;for(const am of p.am)b+=AMEN[am].eff[seg]||0;a*=b;
  if(seg==='conv'&&!p.am.includes('convention'))a*=.35;
  if(seg==='hr'){if(!p.am.includes('dining')&&!p.am.includes('spa'))a*=.6;if(!p.games.includes('bacc'))a*=.5;if(!p.floor)a*=.1;}
  if((seg==='leis'||seg==='bud')&&!p.floor)a*=.6;
  const pm={budget:.75,market:1,premium:1.3}[set.rate];a*=Math.pow(pm,-SEG[seg].sens*1.2);
  if(seg==='hr')a*={tight:.7,normal:1,generous:1.35}[set.comps];
  if(seg==='leis')a*={tight:.95,normal:1,generous:1.08}[set.comps];
  const lim={low:0,mid:1,high:2}[set.limits];
  if(seg==='hr')a*=[.5,.9,1.2][lim];
  if(seg==='bud'||seg==='fam')a*=[1.06,1,.9][lim];
  if(seg!=='hr'&&seg!=='conv')a*={loose:1.08,std:1,tight:.9}[set.hold];
  a*={low:.9,med:1,high:1.12}[set.mkt];
  a*={lean:.93,std:1,luxe:seg==='hr'?1.15:1.06}[set.staff];
  a*=set.layout==='open'?1.04:(seg==='bud'?1:.96);
  if(p.chef&&(seg==='hr'||seg==='leis'))a*=1.05;
  if(p.boost&&p.boost.q>0)a*=p.boost.m[seg]||1;
  if(mine(p))a*=.9+.2*S.rep/100;
  if(seg==='fam'&&y>1993&&p.theme==='bigtop')a*=1.05;
  return Math.max(.001,a);
}
function gfit(p,seg,set){
  const s=MIXES[p.mix].s,lim={low:0,mid:1,high:2}[set.limits];let f=1;
  if(seg==='hr')f=(p.games.includes('bacc')?1.3:.5)*[.5,.9,1.25][lim];
  if(seg==='conv')f=.8+.4*(1-s)+(p.games.includes('book')?.1:0);
  if(seg==='fam')f=.7+.5*s;
  if(seg==='leis')f=.9+.2*(1-s)+(p.games.includes('poker')?.05+(yf(S.t)>2003?.08:0):0)+(p.games.includes('book')?.08:0);
  if(seg==='bud')f=(.6+.6*s+(p.games.includes('keno')?.1:0))*(lim===2?.85:1);
  if(seg==='fam'&&lim===2)f*=.85;
  return f;
}
function demand(t){const q=[.95,1.03,1,1.02][t%4];return S.D0*S.trend*macro(t)*q;}

function simulateMarket(dry){
  const t=S.t,y=yf(t),f=infl(t),sh=segShares(y),D=demand(t);
  const ops=S.props.filter(p=>p.status==='op');
  for(const p of ops){if(p.auto)p.set=autoSet(p);}
  const alloc={};ops.forEach(p=>alloc[p.id]={hr:0,conv:0,fam:0,leis:0,bud:0});
  const caps={};ops.forEach(p=>{let c=p.rooms*91;if(p.project&&!p.project.permitLeft){if(p.project.kind==='renovate')c*=.6;if(p.project.kind==='retheme')c*=.7;if(p.project.kind==='implode')c=0;}caps[p.id]=c*p.disrupt;});
  for(const seg of SEGS){
    const Ds=D*sh[seg];const w={};let sum=0;
    for(const p of ops){w[p.id]=Math.pow(attraction(p,seg),1.6);sum+=w[p.id];}
    for(const p of ops)alloc[p.id][seg]=sum?Ds*w[p.id]/sum:0;
  }
  // capacity with one spill pass
  let spill={hr:0,conv:0,fam:0,leis:0,bud:0};
  for(const p of ops){const tot=SEGS.reduce((s,k)=>s+alloc[p.id][k],0);if(tot>caps[p.id]){const r=caps[p.id]/tot;for(const k of SEGS){spill[k]+=alloc[p.id][k]*(1-r)*.6;alloc[p.id][k]*=r;}}}
  for(const seg of SEGS){if(spill[seg]<=0)continue;const open=ops.filter(p=>SEGS.reduce((s,k)=>s+alloc[p.id][k],0)<caps[p.id]*.98);let sum=0;const w={};for(const p of open){w[p.id]=Math.pow(attraction(p,seg),1.6);sum+=w[p.id];}
    for(const p of open){const room=caps[p.id]-SEGS.reduce((s,k)=>s+alloc[p.id][k],0);alloc[p.id][seg]+=Math.min(room,spill[seg]*w[p.id]/sum);}}
  for(const p of ops){
    const a=alloc[p.id],set=p.set,rn=SEGS.reduce((s,k)=>s+a[k],0);
    const pm={budget:.75,market:1,premium:1.3}[set.rate];
    const staffM={lean:.85,std:1,luxe:1.2}[set.staff]*S.wage;
    let rooms=0,gRaw=0,fb=0;let fbMult=1;for(const am of p.am)fbMult+=AMEN[am].fb||0;
    const hold={loose:.88,std:1,tight:1.12}[set.hold],lay=set.layout==='maze'?1.08:.97;
    const condAdr=.7+.3*p.cond/100;for(const k of SEGS){rooms+=a[k]*ADR_Q[p.q-1]*f*SEG[k].adr*pm*condAdr;gRaw+=a[k]*SEG[k].game*f*gfit(p,k,set)*(k==='hr'?1:hold)*lay;fb+=a[k]*SEG[k].fb*f*fbMult;}
    rooms/=1e6;fb/=1e6;gRaw=gRaw/1e6*(1+LOC[p.loc].walk*(p.am.includes('attraction')?1.4:1));
    const cap=p.floor*.5*f;let gaming=p.floor?Math.min(gRaw,cap)+Math.max(0,gRaw-cap)*.15:0;
    let noLic=false,lostG=0;if(ctrl(p)==='you'&&S.license!=='licensed'){lostG=gaming;gaming=0;noLic=true;}
    let other=0;if(p.am.includes('shopping'))other+=1.5*f*macro(t);if(p.am.includes('arena'))other+=(3+rnd()*5)*f*macro(t);
    if(p.bonusRev){other+=p.bonusRev;p.bonusRev=0;}
    const rev=rooms+gaming+fb+other;
    const c={};
    c.rooms=(p.rooms*.0018*(1+.35*(p.q-1))+rn*15*(1+.4*(p.q-1))/1e6)*f*staffM;
    c.casino=gaming*.28*staffM+(p.floor?p.floor*.008*f:0)+p.games.reduce((s,g)=>s+GAMES[g].up,0)*f;
    c.tax=gaming*.0675;
    c.comps=gaming*{tight:.04,normal:.09,generous:.16}[set.comps];
    c.fb=fb*.66;
    c.marketing=Math.max(.2,{low:.3,med:.9,high:2}[set.mkt]*p.rooms/1000)*f;
    c.upkeep=p.am.reduce((s,am)=>s+AMEN[am].up,0)*f+landVal(p)*.003;
    if(p.boost&&p.boost.q>0)c.upkeep+=p.boost.cost||0;
    c.mgmt=p.auto?rev*.02:0;
    if(ctrl(p)==='pub'){c.rooms*=1.15;c.casino*=1.12;c.fb*=1.1;}
    const cost=Object.values(c).reduce((s,v)=>s+v,0);

    if(!dry){p.ttm.push(pot);if(p.ttm.length>4)p.ttm.shift();}

  }
}

const r2=v=>Math.round(v*100)/100;
function qRow(l,t,you){const c=l.cost;return[t,r2(l.rev.rooms),r2(l.rev.gaming),r2(l.rev.fb),r2(l.rev.other),r2(c.rooms),r2(c.casino),r2(c.tax),r2(c.comps),r2(c.fb),r2(c.marketing),r2(c.upkeep),r2(c.mgmt),r2(l.ebitda),r2(you)];}

function seedHistory(){
  for(const p of S.props){p.qh=[];if(p.status!=='op'||!p.last)continue;const rnd2=hash(p.id+'books');
    for(let k=8;k>=1;k--){const f=Math.pow(1.03,-k/4)*Math.pow(1.05,-k/4)*(.9+rnd2()*.14),cf=Math.pow(1.03,-k/4)*(.97+rnd2()*.06);const row=qRow(p.last,-k,0);

}
function addFlow(k,amt){const o=busy&&S.qInc?S.qInc:S.flow;o[k]=(o[k]||0)+amt;}
// sum a run of quarters; rev, cost and net come out as totals
function sumQ(rows){const s=Array(15).fill(0);for(const r of rows)for(let i=1;i<15;i++)s[i]+=r[i];s.rev=s[1]+s[2]+s[3]+s[4];s.cost=s.slice(5,13).reduce((a,b)=>a+b,0);s.net=s[13];s.n=rows.length;return s;}
const PERIODS={q:'This quarter',y:'This year',y5:'Last 5 years',all:'All time',fc:'Next 4 quarters'};
function rowsFor(p,per){const h=p.qh||[];if(!h.length)return[];
  if(per==='q')return h.slice(-1);if(per==='y'){const y=yrOf(S.t);return h.filter(r=>yrOf(r[0])===y);}
  if(per==='y5')return h.slice(-20);if(per==='4q')return h.slice(-4);if(per==='p4q')return h.slice(-8,-4);return h;}
// a straight-line trend through the last eight quarters, carried four quarters forward, line by line
function forecastQ(p){const h=(p.qh||[]).slice(-8);if(h.length<2||p.status!=='op')return null;const n=h.length,out=Array(15).fill(0);
  for(let i=1;i<14;i++){let sx=0,sy=0,sxy=0,sxx=0;h.forEach((r,j)=>{sx+=j;sy+=r[i];sxy+=j*r[i];sxx+=j*j;});const b=(n*sxy-sx*sy)/Math.max(1e-9,n*sxx-sx*sx),a=(sy-b*sx)/n;
    for(let k=n;k<n+4;k++)out[i]+=Math.max(i===13?-1e9:0,a+b*k);}
  out[13]=out[1]+out[2]+out[3]+out[4]-out.slice(5,13).reduce((a,b)=>a+b,0);out[14]=out[13]*.85*(p.shares.you||0)/100;

function addSums(list){const s=Array(15).fill(0);for(const x of list)if(x)for(let i=1;i<15;i++)s[i]+=x[i];s.rev=s[1]+s[2]+s[3]+s[4];s.cost=s.slice(5,13).reduce((a,b)=>a+b,0);s.net=s[13];return s;}

function trendLine(vals,w,h,col){if(vals.length<2)return'<span class="hint">—</span>';w=w||90;h=h||24;const mn=Math.min(0,...vals),mx=Math.max(...vals,.01);const X=i=>2+i*(w-4)/(vals.length-1),Y=v=>h-2-(v-mn)/(mx-mn||1)*(h-4);
  return`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block">${mn<0?`<line x1="0" x2="${w}" y1="${Y(0)}" y2="${Y(0)}" stroke="#4d457f" stroke-dasharray="2 2"/>`:''}<polyline points="${vals.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ')}" fill="none" stroke="${col||'#ffd319'}" stroke-width="1.6"/><circle cx="${X(vals.length-1)}" cy="${Y(vals[vals.length-1])}" r="2.4" fill="${col||'#ffd319'}"/></svg>`;}

function resultsChart(rowsList,label){

/* ownership & money flows */
function payOwners(p,cost){
  for(const k in p.shares){const amt=cost*p.shares[k]/100;if(!amt)continue;
    if(k==='you'){spend(amt);addFlow('capex',amt);}else if(k==='inv'){invRec(p).paidIn+=amt;}else if(k!=='pub')RIV(k).cash-=amt;}
  p.book+=cost;
}
function distribute(p,amt){
  for(const k in p.shares){const a=amt*p.shares[k]/100;if(!a)continue;
    if(k==='you'){S.cash+=a;S.qInc.dist[p.id]=(S.qInc.dist[p.id]||0)+a;}
    else if(k==='inv'){invRec(p).q+=a;}
    else if(k!=='pub')RIV(k).cash+=a;}
}
function invRec(p){if(!S.inv[p.id])S.inv[p.id]={paidIn:0,hist:[],mood:60,q:0,low:0};return S.inv[p.id];}
function move(p,from,to,pct){pct=Math.min(pct,p.shares[from]||0);if(pct<=0)return 0;p.shares[from]-=pct;if(p.shares[from]<=.001)delete p.shares[from];p.shares[to]=(p.shares[to]||0)+pct;return pct;}

/* pricing */
function buyPrice(p,from,pct){
  const v=val(p)/100*pct;let m;
  const b=ctrlBlocs(p);
  if(from==='pub'){m=1.05;if(b.you<=50&&b.you+pct>50)m+=.05;}
  else{m=1.25;if((p.shares[from]||0)>50&&(p.shares[from]-pct)<=50)m+=.5;if(RIV(from).cash<0)m-=.1;}
  return v*m;
}
const sellInvPrice=(p,pct)=>val(p)/100*pct*(.85+.2*S.conf/100);
const sellMktPrice=(p,pct)=>val(p)/100*pct*.92;
const buybackPrice=(p,pct)=>val(p)/100*pct*1.02;
function canSellInv(p,pct){const you=p.shares.you||0,inv=p.shares.inv||0;return you-pct>=.25*(you+inv)-.001&&you>=pct;}

function permitDelay(){let d=1+(S.city<40?2:S.city<70?1:0)+(rnd()<.4?1:0);return d;}
function specCost(spec){let c=spec.rooms*ROOM_COST[spec.q-1];for(const a of spec.am)c+=AMEN[a].cost;c+=spec.floor*.4;for(const g of spec.games)c+=GAMES[g].cost;return c*infl(S.t);}
function buildQ(spec){return Math.min(8,2+Math.ceil(spec.rooms/800)+(spec.q>=4?1:0));}
function projOptions(p){

/* =========================================================
   QUARTER
   ========================================================= */
function nextQuarter(){
  if(busy||S.over)return;
  if(S.pending.length){showPending();return;}
  busy=true;
  const rep=[],news=[],rivalNews=[];
  S.qInc={dist:{},interest:0,other:0,capex:S.flow.capex||0,buy:S.flow.buy||0,sell:S.flow.sell||0};S.flow={capex:0,buy:0,sell:0};
  const nw0=netWorth();
  S.t++;
  const t=S.t,y=yrOf(t);
  S.trend*=Math.pow(1+lerpT(yf(t),GROWTH),.25);
  for(const s of S.shocks)if(s.s===t)news.push(`📉 <b>${s.n}.</b> Visitor numbers are falling fast.`);
  if(y===1993&&qOf(t)===1)news.push(`🎈 <b>Family Vegas is the new craze.</b> Theme parks and pirate shows draw parents and kids.`);
  if(y===2000&&qOf(t)===1)news.push(`💎 <b>The whales are back.</b> Asian baccarat players drive record high-limit play.`);
  if(y===2004&&qOf(t)===1)news.push(`♠️ <b>Poker is booming</b> after a televised amateur wins the world championship. Poker rooms are packed.`);
  if(y===2004&&qOf(t)===3)news.push(`🏙️ <b>Condo fever.</b> Buyers are lining up for Strip residences.`);
  // projects
  for(const p of S.props){progressProject(p,rep);if(p.boost){p.boost.q--;if(p.boost.q<=0)p.boost=null;}if(p.buzz>0)p.buzz--;}
  // decay
  for(const p of S.props){if(p.status==='op')p.cond=clamp(p.cond-(p.set.staff==='lean'?1.1:.85),5,100);}
  simulateMarket(false);
  for(const p of S.props){p.disrupt=1;if(p.status==='op'&&p.last){distribute(p,p.last.ebitda*.85);recordQuarter(p,t,S.qInc.dist[p.id]||0);}}
  // skim
  if(S.skim){const p=P(S.skim.p);if(p&&p.status==='op'&&mine(p)){const amt=(.4+(p.last?p.last.rev.gaming:0)*.03);S.cash+=amt;S.qInc.other+=amt;S.heat=clamp(S.heat+6,0,100);}S.skim.q--;if(S.skim.q<=0){S.skim=null;rep.push('The arrangement in the count room quietly ends.');}}
  // investors
  for(const id in S.inv){const r=S.inv[id],p=P(id);if(!p||!(p.shares.inv>0)){delete S.inv[id];continue;}
    r.hist.push(r.q);if(r.hist.length>4)r.hist.shift();r.q=0;
    const building=p.status!=='op'||(p.project&&p.project.kind==='build');
    if(building){r.mood=clamp(r.mood-1.5,0,100);}
    else{const yld=r.hist.reduce((a,b)=>a+b,0)/r.hist.length*4/Math.max(1,r.paidIn);const tgt=(prime(t)+3)/100;r.mood=clamp(r.mood+((50+(yld-tgt)*300)-r.mood)*.35,0,100);}
    r.low=r.mood<25?r.low+1:0;}
  // interest
  const intr=S.loan*loanRate()/400;S.qInc.interest=intr;spend(intr);
  // rivals
  for(const r of S.rivals){if(r.cash<0)r.cash-=-r.cash*(prime(t)+1.5)/400;}
  rivalAI(rivalNews);
  // margin
  const lim=creditLimit();
  if(S.loan>lim+.01||S.cash<-.01){
    const sold=marginCall();rep.push(`⚠️ <b>Margin call.</b> The bank forced the sale of ${sold}. Your backers are rattled.`);S.conf=clamp(S.conf-15,0,100);
  }
  // authorities
  authorities(rep);
  // confidence
  const nw=netWorth();const chg=(nw-nw0)/Math.max(20,Math.abs(nw0),S.cash+stakesVal());
  let dc=clamp(chg*60,-8,8);const moods=Object.values(S.inv).map(r=>r.mood);if(moods.length)dc+=(moods.reduce((a,b)=>a+b,0)/moods.length-50)/25;
  S.conf=clamp(S.conf+dc+(60-S.conf)*.03,0,100);
  S.city=clamp(S.city+(40-S.city)*.03,0,100);S.mob*=.96;S.heat=clamp(S.heat-2,0,100);S.rep=clamp(S.rep+(50-S.rep)*.02,0,100);
  S.hist.push({t,nw,cash:S.cash,loan:S.loan});
  S.report={t,rep,news,rivalNews,inc:S.qInc,nw,nw0};S.lastInc=S.qInc;S.qInc.t=t;S.ledger.push(S.qInc);
  // events
  drawEvents();
  if(t>=12&&(t-12)%8===0)S.pending.push({kind:'review'});
  if(S.conf<=0)S.over={kind:'fired',why:'Your backers have lost all confidence in you. The partners recall you to New York and hand your portfolio to someone else.'};
  if(S.props.every(p=>mine(p)))S.over={kind:'win',why:'You control every property on the Strip. Nobody in Las Vegas has ever held so much.'};
  if(t>=MAXT&&!S.over)S.pending.push({kind:'retire'});
  busy=false;save();render();
  openReport();
}
function marginCall(){
  const sold=[];
  const hold=S.props.filter(p=>(p.shares.you||0)>0).sort((a,b)=>val(a)*(a.shares.you)-val(b)*(b.shares.you));
  for(const p of hold){
    if(S.loan<=creditLimit()&&S.cash>=0)break;
    const pct=p.shares.you;const pr=val(p)/100*pct*.85;move(p,'you','pub',pct);S.cash+=pr;
    const pay=Math.min(S.cash,S.loan);S.loan-=pay;S.cash-=pay;sold.push(`your ${pct.toFixed(0)}% of ${p.name}`);
  }
  if(S.loan>creditLimit()+.01||S.cash<-.01){S.over={kind:'fired',why:'The bank called your loans and there was nothing left to sell. Your career in Las Vegas is over.'};}
  return sold.join(', ')||'nothing';
}
function authorities(rep){
  if(S.license==='pending'){S.licQ--;if(S.licQ<=0){const pr=.92-S.heat/120-(S.mob>40?.2:0);if(rnd()<pr){S.license='licensed';rep.push('✅ <b>The Gaming Commission approves your license.</b> Casinos you control can now take bets.');}else{S.license='none';S.licWait=4;rep.push('❌ The Gaming Commission denied your license application. You can reapply in a year.');}}}
  else if(S.license==='suspended'){S.licQ--;if(S.licQ<=0){S.license='licensed';rep.push('Your gaming license is reinstated.');}}
  if(S.licWait>0)S.licWait--;
  if(S.license==='licensed'&&rnd()<Math.max(0,S.heat-25)/220){
    if(S.heat>85){S.license='revoked';S.licWait=12;
      let lost=[];for(const p of S.props){if(mine(p)&&p.status==='op'&&p.floor>0&&(p.shares.you||0)>10){const pct=p.shares.you-10;S.cash+=val(p)/100*pct*.8;move(p,'you','pub',pct);lost.push(p.name);}}
      rep.push(`🚨 <b>License revoked.</b> The Gaming Commission found you unsuitable. You were forced to sell down in ${lost.join(', ')||'your casinos'}.`);S.conf=clamp(S.conf-30,0,100);S.heat=50;
    }else if(S.heat>55){S.license='suspended';S.licQ=2;rep.push('🚨 <b>License suspended for two quarters</b> after a Gaming Control Board investigation.');S.conf=clamp(S.conf-12,0,100);S.heat-=15;}
    else{const fine=(2+S.heat/10)*infl(S.t);spend(fine);S.qInc.other-=fine;rep.push(`🚨 The Gaming Control Board fines you ${M(fine)} after an investigation.`);S.conf=clamp(S.conf-6,0,100);S.heat-=20;}
  }
}

function rivalSpec(r,p){
  const y=yrOf(S.t);const used=new Set(S.props.filter(o=>o.status==='op').map(o=>o.theme));
  let opts=STYLE_THEMES[r.style].filter(th=>!THEMES[th].minYear||y>=THEMES[th].minYear);
  const fresh=opts.filter(th=>!used.has(th));const theme=pick(fresh.length?fresh:opts);
  const q=r.style==='luxury'?(y>=1992?5:4):r.style==='mid'?4:3;
  const rooms=Math.max(800,Math.min(maxRooms(p),Math.round((1200+(y-1988)*180)/100)*100,4500));
  const am=['buffet','dining','showroom','pool'];if(q>=4)am.push('spa','convention','shopping');if(r.style==='family'||(r.style==='mid'&&rnd()<.5))am.push('attraction');if(y>=1999&&q>=4&&rnd()<.4)am.push('arena');
  const games=['book'];if(q>=4)games.push('bacc');if(y>=2004)games.push('poker');if(q<=3)games.push('keno');
  const NAMES={classic:['The Diamond','Lucky Star','The Ace'],western:['Gold Rush','The Mustang'],tropical:['Coral Isle','Lagoon'],riviera:['The Monaco','Portofino','Villa Lucia'],ancient:['Babylon','The Colossus','Atlantis'],space:['Orbit','Galaxy'],pirate:['Buccaneer Bay','Skull Island'],city:['Metropolis','Gotham Grand'],bigtop:['Big Top','Carnival City'],luxe:['Aurum','The Reserve','Lumen']};

function marketRatio(ahead){const cap=S.props.reduce((a,p)=>a+(p.status==='op'?p.rooms:0)+(p.project&&p.project.kind==='build'?p.project.spec.rooms:0)+(p.project&&p.project.kind==='expand'?p.project.add:0),0)*91;return demand(S.t)*Math.pow(1+lerpT(yf(S.t),GROWTH),ahead||2)/Math.max(1,cap);}
function rivalAI(news){
  const hot=marketRatio(2)>.95;
  for(const r of S.rivals){
    if(rnd()>.45)continue;
    const ctl=S.props.filter(p=>ctrl(p)===r.id);
    // build on lots
    const lot=ctl.find(p=>p.status==='lot'&&!p.project);
    if(lot&&hot&&r.cash>-250){const spec=rivalSpec(r,lot);const o={kind:'build',n:'New resort',cost:specCost(spec),q:buildQ(spec),permit:true};startProject(lot,o,spec);news.push(`🏗️ <b>${r.n}</b> breaks ground on <b>${esc(spec.name)}</b>, a ${spec.rooms.toLocaleString()}-room ${THEMES[spec.theme].n.toLowerCase()} resort.`);continue;}
    const old=hot&&ctl.find(p=>p.status==='op'&&!p.project&&p.built<1976&&p.q<=3&&p.acres>=20&&yrOf(S.t)>=1990&&rnd()<.3);
    if(old){startProject(old,{kind:'implode',n:'Implode',cost:(3+old.rooms*.002)*infl(S.t),q:1});news.push(`💥 <b>${r.n}</b> will implode <b>${esc(old.name)}</b> to make way for something bigger.`);continue;}
    const worn=ctl.find(p=>p.status==='op'&&!p.project&&p.cond<45);
    if(worn&&r.cash>-300){const o=projOptions(worn).find(x=>x.kind==='renovate');startProject(worn,o);continue;}
    // defend
    const threat=S.props.find(p=>ctrl(p)===r.id&&ctrlBlocs(p).you>=30&&(p.shares.pub||0)>0&&(p.shares[r.id]||0)<55);
    if(threat){const pct=Math.min(threat.shares.pub,55-threat.shares[r.id]);r.cash-=buyPrice(threat,'pub',pct);move(threat,'pub',r.id,pct);news.push(`🛡️ <b>${r.n}</b> buys ${pct.toFixed(0)}% more of <b>${esc(threat.name)}</b> to fend you off.`);continue;}
    if(r.cash>40){
      const cand=S.props.filter(p=>(p.shares.pub||0)>=100&&!p.project).sort((a,b)=>val(a)-val(b));
      if(cand.length&&rnd()<.5){const p=cand[0];const pr=buyPrice(p,'pub',100);if(pr<r.cash*3+150){r.cash-=pr;move(p,'pub',r.id,100);news.push(`🤝 <b>${r.n}</b> buys <b>${esc(p.name)}</b> outright for ${M(pr)}.`);continue;}}
      const part=S.props.find(p=>(p.shares[r.id]||0)>0&&(p.shares.pub||0)>0);
      if(part){const pct=Math.min(10,part.shares.pub);r.cash-=buyPrice(part,'pub',pct);move(part,'pub',r.id,pct);continue;}
      const target=S.props.find(p=>mine(p)&&(p.shares.pub||0)>=10&&ctrlBlocs(p).you<65);
      if(target&&r.cash>150&&rnd()<.4){const pct=Math.min(10,target.shares.pub);r.cash-=buyPrice(target,'pub',pct);move(target,'pub',r.id,pct);news.push(`👀 <b>${r.n}</b> quietly buys ${pct.toFixed(0)}% of your <b>${esc(target.name)}</b>.`);}
    }
    if(r.cash<-600){const p=S.props.find(p=>(p.shares[r.id]||0)>=10&&ctrl(p)!==r.id)||S.props.find(p=>(p.shares[r.id]||0)>=60);if(p){const pct=10;r.cash+=val(p)/100*pct*.9;move(p,r.id,'pub',pct);news.push(`📉 <b>${r.n}</b> sells 10% of <b>${esc(p.name)}</b> to pay down debt.`);}}
  }
}

function drawEvents(){
  const n=rnd()<.6?(rnd()<.3?2:1):0;
  const used=new Set();
  if(EVENTS.labor.w()>0){S.pending.push({kind:'event',id:'labor',a:EVENTS.labor.make()});used.add('labor');}
  for(let k=0;k<n;k++){
    const pool=Object.entries(EVENTS).filter(([id,e])=>!used.has(id)&&S.t-(S.lastEvt[id]||-99)>=4).map(([id,e])=>[id,e.w()]).filter(x=>x[1]>0);
    const tot=pool.reduce((s,x)=>s+x[1],0);if(!tot)break;let r=rnd()*tot;
    for(const [id,w] of pool){r-=w;if(r<=0){used.add(id);S.lastEvt[id]=S.t;S.pending.push({kind:'event',id,a:EVENTS[id].make()});break;}}
  }
  S.flagNewBuild=null;
}

function buyStake(p,from,pct){
  pct=Math.min(pct,p.shares[from]||0);if(pct<=0)return;
  const pr=buyPrice(p,from,pct);if(pr>available()+1e-6){toast(`You need ${M(pr)} but only have ${M(available())} in cash and credit.`);return;}
  const wasMine=mine(p);spend(pr);addFlow('buy',pr);move(p,from,'you',pct);
  if(from!=='pub')RIV(from).cash+=pr;
  toast(`You bought ${pct.toFixed(0)}% of ${p.name} for ${M(pr)}.`);
  if(!wasMine&&mine(p)){p.auto=true;toast(`You now control ${p.name}.${S.license!=='licensed'&&p.floor?' Its casino is dark until you hold a gaming license.':''}`);}
  save();render();openProp(p.id);
}
function sellInv(p,pct){if(!canSellInv(p,pct))return;const pr=sellInvPrice(p,pct);move(p,'you','inv',pct);S.cash+=pr;addFlow('sell',pr);invRec(p).paidIn+=pr;toast(`Your investors paid ${M(pr)} for ${pct}% of ${p.name}.`);save();render();openProp(p.id);}
function sellMkt(p,pct){pct=Math.min(pct,p.shares.you||0);const pr=sellMktPrice(p,pct);move(p,'you','pub',pct);S.cash+=pr;addFlow('sell',pr);toast(`You sold ${pct.toFixed(0)}% of ${p.name} for ${M(pr)}.`);save();render();openProp(p.id);}
function buyback(p){const pct=p.shares.inv||0;const pr=buybackPrice(p,pct);if(pr>available()){toast('Not enough cash and credit.');return;}spend(pr);addFlow('buy',pr);move(p,'inv','you',pct);delete S.inv[p.id];toast(`You bought out your investors in ${p.name}.`);save();render();}

  $('#hud').innerHTML=`<div class="hud-top"><div class="brand">HOUSE EDGE</div><div class="date"><b>${dateStr(S.t)}</b><span>${TITLES[S.title]}</span></div><button class="iconbtn" data-a="menu" aria-label="Menu">☰</button></div>
  <div class="stats"><div class="stat"><small>Cash</small><b class="num">${M(S.cash)}</b></div><div class="stat"><small>Net worth</small><b class="num ${nw<0?'neg':''}">${M(nw)}</b></div><div class="stat"><small>Credit left</small><b class="num">${M(Math.max(0,creditLimit()-S.loan))}</b></div></div>
  <div class="meters">${meter('Backers',S.conf,S.conf<30?'var(--bad)':'var(--good)')}${meter('Heat',S.heat,S.heat>55?'var(--bad)':'var(--gold)')}${meter('County',S.city,'var(--cyan)')}${meter('Syndicate',(S.mob+100)/2,S.mob<-35?'var(--bad)':'#b388ff',(S.mob>0?'+':'')+Math.round(S.mob))}</div>`;
}
function renderTabs(){
  const T=[['strip','🌃','Strip'],['hold','💼','Holdings'],['deals','🤝','Deals'],['city','🏛️','City'],['money','📈','Money']];
  const b=T.map(([k,i,l])=>`<button class="tab ${tab===k?'on':''}" data-a="tab" data-k="${k}"><span>${i}</span>${l}</button>`);
  b.splice(3,0,`<button id="nextBtn" data-a="next" ${S.over?'disabled':''}>${S.pending.length?'Continue ▸':'Next quarter ▸'}</button>`);
  $('#tabs').innerHTML=b.join('');
}

// every property side by side: what it earns, from what, how it is trending, what it costs to buy into

  const R=S.report;if(!R)return showPending();
  const inc=R.inc;const dsum=Object.values(inc.dist).reduce((a,b)=>a+b,0);
  const all=[...R.news,...R.rep,...R.rivalNews];
  openSheet(`<p class="newsdate">${dateStr(R.t)} · Quarterly edition</p><h2 class="news">The Strip Ledger</h2>
  <div class="panel"><h3>Your quarter</h3><div class="kv"><div>Payouts from properties</div><div class="${dsum<0?'neg':'pos'}">${M(dsum)}</div>${inc.other?`<div>Other</div><div class="${inc.other<0?'neg':'pos'}">${M(inc.other)}</div>`:''}<div>Loan interest</div><div class="neg">${M(-inc.interest)}</div><div class="tot">Net worth</div><div class="tot">${M(R.nw)} <span class="${R.nw>=R.nw0?'pos':'neg'}" style="font-size:12px">${R.nw>=R.nw0?'▲':'▼'} ${M(Math.abs(R.nw-R.nw0))}</span></div></div></div>
  <div class="panel">${all.length?all.map(s=>`<div class="story">${s}</div>`).join(''):'<div class="story">A quiet quarter on the Strip.</div>'}</div>
  <button class="btn primary" data-a="reportdone">${S.pending.length?'Continue':'Back to the Strip'}</button>`);
}
function showPending(){
  if(S.over){showOver();return;}
  const e=S.pending[0];if(!e){closeSheet();render();return;}
  if(e.kind==='event'){
    const ev=EVENTS[e.id].view(e.a);
    openSheet(`<div class="evt-art">${ev.art}</div><h2 class="news" style="font-size:26px;border:none">${esc(ev.title)}</h2><p class="evt-text">${esc(ev.text)}</p><div class="btns">${ev.ch.map((c,i)=>`<button class="btn" data-a="choice" data-k="${i}" ${c.dis?'disabled':''}><span>${esc(c.l)}${c.s?`<small>${esc(c.s)}</small>`:''}</span></button>`).join('')}</div>`);
  } else if(e.kind==='review')showReview();
  else if(e.kind==='retire')showRetire();
}
function choose(i){
  const e=S.pending[0];if(!e||e.kind!=='event')return;
  const ev=EVENTS[e.id].view(e.a);const c=ev.ch[i];if(!c||c.dis)return;
  const out=c.f();S.pending.shift();save();render();
  openSheet(`<div class="evt-art">${ev.art}</div><h2 class="news" style="font-size:24px;border:none">${esc(ev.title)}</h2><p class="evt-text"><b>${esc(c.l)}.</b> ${esc(out||'')}</p><button class="btn primary" data-a="pendnext">Continue</button>`);
}
function reviewNW(){const h=S.hist.slice(-4);return h.reduce((a,x)=>a+x.nw,0)/h.length;}
function reviewTarget(){return S.target*clamp(.75+.25*macro(S.t),.75,1);}
function nextTarget(nw){const g=lerpT(yf(S.t),[[1990,1.3],[2000,1.25],[2020,1.18],[2047,1.12]]);return Math.max(S.target*g,nw*1.1);}
function showReview(){
  const nw=reviewNW(),tg=reviewTarget(),r=nw/tg;let verdict,txt,cls;
  if(r>=1.25){verdict='Outstanding';cls='good';txt=S.title<TITLES.length-1?`The partners are thrilled. You are promoted to <b>${TITLES[S.title+1]}</b>, and the bank raises your credit line.`:'The partners have run out of titles to give you.';}
  else if(r>=1){verdict='Meets expectations';cls='cyan';txt='Solid work. The partners want more next time.';}
  else{verdict='Below target';cls='bad';txt=S.strikes>=1?'This is your second miss in a row. The partners have seen enough.':'The partners are disappointed. Miss the next target and you are finished.';}
  const nextT=nextTarget(nw);
  openSheet(`<p class="newsdate">${dateStr(S.t)} · New York</p><h2 class="news" style="font-size:26px">Board review</h2>
  <div class="panel"><div class="kv"><div>Target${tg<S.target-.01?' (eased for the downturn)':''}</div><div>${M(tg)}</div><div>Your net worth, last 4 quarters avg.</div><div>${M(nw)}</div><div class="tot">Result</div><div class="tot"><span class="chip ${cls}">${verdict}</span></div></div></div>
  <p class="evt-text">${txt}</p>${(r>=1||S.strikes<1)?`<p class="hint">Next review in two years. Target: <b>${M(nextT)}</b>.</p>`:''}
  <button class="btn primary" data-a="reviewdone">Continue</button>`);
}
function reviewDone(){
  const nw=reviewNW(),r=nw/reviewTarget();
  if(r>=1.25){if(S.title<TITLES.length-1)S.title++;S.conf=clamp(S.conf+15,0,100);S.strikes=0;}
  else if(r>=1){S.conf=clamp(S.conf+6,0,100);S.strikes=0;}
  else{S.strikes++;S.conf=clamp(S.conf-12,0,100);if(S.strikes>=2)S.over={kind:'fired',why:'Two missed targets in a row. The partners recall you to New York and hand your book to someone younger and hungrier.'};}
  S.target=nextTarget(nw);
  S.pending.shift();save();render();showPending();
}
function showRetire(){S.over={kind:'retire',why:`Sixty years after you arrived with a borrowed bankroll, you retire as ${TITLES[S.title]}.`};showOver();}
function showOver(){
  const o=S.over;clearSave();const nw=netWorth();const ctl=S.props.filter(mine).length;
  const head={fired:'Fired',win:'You own the Strip',retire:'A legend retires'}[o.kind];
  openSheet(`<div class="logo-big">${o.kind==='fired'?'GAME OVER':'JACKPOT'}</div><h2 class="news" style="border:none">${head}</h2><p class="evt-text" style="text-align:center;margin:0 auto">${esc(o.why)}</p>
  <div class="panel"><div class="kv"><div>Date</div><div>${dateStr(S.t)}</div><div>Final title</div><div>${TITLES[S.title]}</div><div>Net worth</div><div>${M(nw)}</div><div>Properties you control</div><div>${ctl} of ${S.props.length}</div></div></div>
  <div class="panel"><h3>Your career</h3>${sparkline()}</div>
  <button class="btn primary" data-a="newgame">Start a new career</button>`);
}

/* ---------- intro & menu ---------- */
// bump with every release, so a player can say which build they are on
const APP_VERSION='0.3';
function showIntro(){
  const saved=loadSave();
  openSheet(`<div class="logo-big">HOUSE EDGE</div><p class="ver">Version ${APP_VERSION}</p><p class="lede">Las Vegas, 1988.</p>
  <p class="evt-text">You're a junior associate at Halloran Brothers, a New York merchant bank. The partners have sent you west with <b>$10 million</b> of the firm's money and a <b>$75 million</b> credit line. The old Strip is tired, the mob is on its way out, and something much bigger is about to be built.</p>
  <p class="evt-text">Buy tired motels and empty desert. Build resorts. Bring in investors. Take stakes in your rivals and take them over. Keep the Gaming Commission, the county and the Syndicate on side, or deal with the fallout. Your first review is in three years, then every two. Keep making money and you keep your job.</p>
  ${saved?`<button class="btn primary" data-a="resume">Continue your career · ${dateStr(saved.t)}</button>`:''}
  <input type="text" id="pname" placeholder="Your name" value="${esc(saved?saved.name:'Jeff')}" maxlength="18">
  <button class="btn ${saved?'':'primary'}" data-a="start">${saved?'Start over':'Fly to Las Vegas'}</button>
  <div class="panel"><h3>Getting started</h3><p class="hint" style="margin:0">1. Buy something cheap on the Deals tab: you already hold a gaming license. 2. Press Next quarter and see how it does. 3. Keep your heat low, or the Gaming Commission may suspend or revoke your license. Tap any building on the skyline for its full numbers.</p></div>`);
}
function showMenu(){
  openSheet(`<div class="sheet-head"><h2>Menu</h2><button class="iconbtn" data-a="close">✕</button></div>
  <div class="panel"><h3>How it works</h3><div class="hint" style="font-size:13px;line-height:1.55">
  <p><b>Each turn is a quarter.</b> Hotels fill up with five types of guests. Each type likes different themes, star ratings, prices, amenities and casino games. Lit windows on the skyline show occupancy.</p>
  <p><b>Control</b> means you and your investors together hold more than 50%. Only the controlling owner runs and develops a property. Your investors fund their share of every project and expect a return. Unhappy investors may walk, and their shares can end up with a rival.</p>
  <p><b>Payouts:</b> owners receive 85% of each property's net income every quarter (revenue minus running costs, before anyone's loan interest). Losses become capital calls.</p>
  <p><b>Value</b> is about ${valMult(S.t).toFixed(1)} times a year's net income, never less than the land underneath. Land and condo prices follow real Las Vegas booms and busts.</p>
  <p><b>Win</b> by controlling every property, or by surviving sixty years. Lose by missing two reviews in a row, running out of backer confidence, or getting margin-called with nothing left to sell.</p></div></div>
  <button class="btn" data-a="quit">Abandon this career</button>
  <p class="ver">House Edge · version ${APP_VERSION}</p>`);
}
let toastT;function toast(m){let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';document.body.appendChild(el);}el.textContent=m;el.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>{el.style.opacity=0;},2800);}

/* ---------- action router ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el||el.disabled)return;
  const a=el.dataset.a,id=el.dataset.id,k=el.dataset.k,p=id?P(id):null;
  switch(a){
    case 'tab':tab=k;render();$('#view').scrollTop=0;break;
    case 'filter':dealFilter=k;render();break;
    case 'dview':dealView=k;render();break;
    case 'dsort':dealSort=dealSort.k===k?{k,d:-dealSort.d}:{k,d:k==='name'?1:-1};render();break;
    case 'lper':ledgerPer=k;render();break;
    case 'prop':flyTo(id);openProp(id);break;
    case 'cam':camAction(k);break;
    case 'close':closeSheet();break;
    case 'menu':showMenu();break;
    case 'next':nextQuarter();break;
    case 'buy':buyStake(p,el.dataset.f,+k);break;
    case 'sellinv':sellInv(p,+k);break;
    case 'sellmkt':sellMkt(p,+k);break;
    case 'buyback':buyback(p);if(!$('#ov').hidden&&$('.sheet-head'))openProp(id);break;
    case 'auto':p.auto=!p.auto;if(p.auto)p.set=autoSet(p);save();openProp(id);break;
    case 'set':p.set[el.dataset.s]=k;save();openProp(id);break;
    case 'floor':{const nf=+k;const cost=Math.max(0,nf-p.floor)*.4*infl(S.t);const share=cost*(p.shares.you||0)/100;if(share>available()){toast('Not enough cash and credit.');break;}payOwners(p,cost);p.floor=nf;save();render();openProp(id);if(cost)toast(`Casino floor resized. Your share: ${M(share)}.`);break;}
    case 'mix':p.mix=k;save();openProp(id);break;
    case 'game':{if(p.games.includes(k)){p.games=p.games.filter(g=>g!==k);}else{const cost=GAMES[k].cost*infl(S.t);if(cost*(p.shares.you||0)/100>available()){toast('Not enough cash and credit.');break;}payOwners(p,cost);p.games.push(k);}save();render();openProp(id);break;}
    case 'proj':{const o=projOptions(p)[+k];if(!o)break;const share=o.cost*(p.shares.you||0)/100/o.q;if(share>available()){toast('You cannot cover even the first quarter of this.');break;}if(startProject(p,o)!==false){toast(`${o.n} is underway at ${p.name}.`);}save();render();openProp(id);break;}
    case 'design':design=null;openDesigner(id);break;
    case 'retheme':design=null;openDesigner(id,true);break;
    case 'dset':{const s=el.dataset.s;const d=design;if(s==='theme')d.theme=k;else if(s==='q')d.q=+k;else if(s==='floor')d.floor=+k;else if(s==='mix')d.mix=k;else if(s==='am')d.am=d.am.includes(k)?d.am.filter(x=>x!==k):[...d.am,k];else if(s==='games')d.games=d.games.includes(k)?d.games.filter(x=>x!==k):[...d.games,k];const sc=$('#sheet').scrollTop;openDesigner(design.id,design.retheme);$('#sheet').scrollTop=sc;break;}
    case 'dstart':{const d=design;if(d.retheme){const o=projOptions(p).find(x=>x.kind==='retheme');startProject(p,{...o},null);p.project.theme=d.theme;p.project.n=`Retheme to ${THEMES[d.theme].n}`;toast('Retheme underway.');}
      else{const spec={name:(d.name||'').trim()||THEMES[d.theme].n,theme:d.theme,q:d.q,rooms:d.rooms,am:[...d.am],floor:d.floor,mix:d.mix,games:[...d.games]};const cost=specCost(spec);const o={kind:'build',n:`Building ${spec.name}`,cost,q:buildQ(spec),permit:true};if(startProject(p,o,spec)!==false)toast(`${spec.name} is in for permits.`);}
      design=null;save();render();openProp(id);break;}
    case 'license':{const c=.25*infl(S.t);spend(c);S.license='pending';S.licQ=2;toast('Application filed. Decision in two quarters.');save();render();break;}
    case 'donate':{const c=1.5*infl(S.t);if(c>available()){toast('Not enough cash.');break;}spend(c);S.city=clamp(S.city+10,0,100);S.donQ=S.t;toast('The county commissioners send their thanks.');save();render();break;}
    case 'mob':{if(k==='respect'){const c=1*infl(S.t);spend(c);S.mob=clamp(S.mob+20,-100,100);S.heat=clamp(S.heat+5,0,100);toast('Your gift is received.');}else{S.mob=clamp(S.mob-8,-100,100);S.heat=clamp(S.heat-2,0,100);toast('You keep things strictly legitimate.');}S.mobQ=S.t;save();render();break;}
    case 'draw':{const amt=Math.min(+k,Math.max(0,creditLimit()-S.loan));if(amt<=0){toast('Your credit line is maxed out.');break;}S.loan+=amt;S.cash+=amt;save();render();break;}
    case 'repay':{const amt=k==='all'?Math.min(S.cash,S.loan):Math.min(+k,S.cash,S.loan);S.loan-=amt;S.cash-=amt;save();render();break;}
    case 'reportdone':S.report=null;save();if(S.pending.length||S.over)showPending();else closeSheet();render();break;
    case 'choice':choose(+k);break;
    case 'pendnext':showPending();break;
    case 'reviewdone':reviewDone();break;
    case 'start':{const n=($('#pname')&&$('#pname').value.trim())||'Jeff';clearSave();newGame(n);tab='strip';closeSheet();render();save();toast('Welcome to Las Vegas. Your gaming license is in your pocket.');break;}
    case 'resume':S=loadSave();closeSheet();render();if(S.report)openReport();else if(S.pending.length||S.over)showPending();break;
    case 'newgame':S=null;showIntro();break;
    case 'quit':clearSave();S=null;showIntro();break;
  }
});
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov'&&S&&!S.pending.length&&!S.over&&!S.report)closeSheet();});

/* boot */
showIntro();
</script>
</body>
</html>
